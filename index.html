<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TanYu's Neverland</title>
<link rel="stylesheet" href="/custom.css">
</head>
<body class="splash-body">
  <div class="splash-page">
    <div class="splash-page-inner">
      <h1 class="splash-page-title">TanYu's Neverland</h1>
      <p class="splash-page-sub">欢迎喵</p>
      <a class="splash-page-btn" href="/blog/">进入博客</a>
      <p class="splash-page-hint">点击按钮进入</p>
    </div>
  </div>
<script>
  // 进入开屏页时先清除旧标记，确保只有点击按钮跳转时才触发小人欢迎
  try { sessionStorage.removeItem('fromSplash'); } catch (e) {}
  var btn = document.querySelector('.splash-page-btn');
  if (btn) {
    btn.addEventListener('click', function() {
      try { sessionStorage.setItem('fromSplash', 'true'); } catch (e) {}
    });
  }
</script>
</body>
</html>
